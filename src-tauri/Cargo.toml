[package]
name = "mhdanmutoolsv2"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mhdanmutoolsv2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 说明：显式列出 tauri 默认特性，唯独排除 common-controls-v6。
# 该特性会让 muda（菜单库）编译并链接 comctl32 v6 才导出的 TaskDialogIndirect，
# 而 cargo test 生成的测试二进制没有 Common-Controls 清单，会在加载期以
# STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) 失败（该代码仅用于 About/消息对话框，本工程未使用）。
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "x11",
    "dbus",
    # 悬浮窗（overlay）透明背景在 macOS 上依赖私有 API，缺此特性时 transparent 会退化为不透明底
    "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# D2：悬浮窗锁定/解锁全局热键（Alt+,）
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# 长连 WSS 的 TLS 提供方必须显式钉死：tokio-tungstenite 以 default-features=false 引入 rustls
# 且不启用任何 crypto provider feature，握手期 rustls 无法判定 provider 直接 panic，
# release 的 panic="abort" 会让整个进程退出（HTTP 侧走 native-tls 故不受影响）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# C1 打卡 AI 关键词学习：对齐原工程 cppjieba 分词（内嵌标准 jieba 词典 + HMM 新词识别）
jieba-rs = "0.11"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
