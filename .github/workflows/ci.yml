# 持续集成：Windows 与 macOS 双平台全量门禁
# 门禁口径与 package.json 的 `verify` 脚本一致：前端构建(tsc+vite) → Rust 单测 → 编码规范核查
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-windows:
    name: 构建与单元测试 (Windows)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # tauri-build 在编译期会校验 frontendDist(../dist) 是否存在，
      # 故必须先产出前端产物，否则 cargo test 会直接构建失败。
      - name: 前端类型检查与构建
        run: npm run build

      - name: 编码规范核查（.rs/.ts/.tsx/.css/.md 需 BOM，JSON 不得带 BOM）
        run: npm run check:encoding

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  verify-macos:
    name: 构建与单元测试 (macOS)
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      - name: 编码规范核查（.rs/.ts/.tsx/.css/.md 需 BOM，JSON 不得带 BOM）
        run: npm run check:encoding

      # 平台专有路径（macOS 数据目录脱离 .app 包体、registry.dat 加密存储、say 兜底语音）
      # 均有单测覆盖，故此处与 Windows job 同口径跑全量单测而非仅 cargo check
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
