# 发布打包：推送 tag（如 0.1.0 或 v0.1.0）触发 Windows 与 macOS 安装包构建，并附加到 GitHub Release。
# 每平台连产「完整版」与「Lite 纯排队版」两套产物（Lite = Cargo feature `lite` + tauri.conf.lite.json）
# 与 ci.yml 的分工：ci.yml 管「提交是否健康」，本文件管「版本能否发出去」
name: Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:

# gh release create/upload 需要写权限；默认 GITHUB_TOKEN 只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle-windows:
    name: 打包 Windows 安装包（完整版 + Lite）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 连产两版（同 job 串行：第二次构建复用依赖缓存，仅重编译本 crate）：
      # 1) 完整版：beforeBuildCommand(npm run build) 先产前端，再按 bundle.targets="all" 生成 msi + nsis
      # 2) Lite 纯排队版：Cargo feature `lite` + tauri.conf.lite.json（产物名 *-Lite，与完整版同目录共存）
      # 上传路径为通配，两版产物自动全部收录
      - name: 打包完整版安装包
        run: npm run tauri build

      - name: 打包 Lite 版安装包
        run: npm run tauri build -- --features lite --config src-tauri/tauri.conf.lite.json

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 仅 tag 触发时建 Release；workflow_dispatch 手动运行只产出 Actions 产物
      # 先 view 再 create/upload：重复运行同一 tag 时覆盖附件而不是报错退出
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 两个打包 job 并行，Release 可能已被另一个 job 建好：
          # 故 create 失败不视为错误（`|| true`）；若 upload 真失败仍会正常报错退出
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe

  bundle-macos:
    name: 打包 macOS 安装包（完整版 + Lite）
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # macos-latest 为 Apple Silicon，bundle.targets="all" 在此产出 .app + aarch64 .dmg。
      # 注：产物为 adhoc 签名（无 TeamIdentifier，未公证），用户首次打开需右键「打开」放行。
      # 与 Windows job 同口径连产完整版与 Lite 版（tauri.conf.lite.json），dmg 通配自动收录两版
      - name: 打包完整版安装包
        run: npm run tauri build

      - name: 打包 Lite 版安装包
        run: npm run tauri build -- --features lite --config src-tauri/tauri.conf.lite.json

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 同上：并行 job 下 create 可能已被另一端完成，失败不阻断
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/dmg/*.dmg
