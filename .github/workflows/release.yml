# 发布打包：推送 tag（如 0.1.0 或 v0.1.0）触发 Windows 与 macOS 安装包构建，并附加到 GitHub Release。
# 每平台连产「完整版」与「Lite 纯排队版」两套产物（Lite = Cargo feature `lite` + tauri.conf.lite.json）
# 与 ci.yml 的分工：ci.yml 管「提交是否健康」，本文件管「版本能否发出去」
#
# 耗时优化（2026-09-30）：原单 job 串行双版构建 ~17 分钟，瓶颈有二——
# 1. tag ref 作用域内互相读不到缓存，且 CI 的 debug profile 缓存不通用，每次 tag 都全量冷编
#    371 个依赖（10 分钟）。现由 ci.yml 的 warm-rust-* job 在 master 作用域常驻预热 release
#    依赖缓存（cargo build --release --lib），本 workflow 各 job 以相同 shared-key 恢复；
# 2. lto=true + codegen-units=1（体积/性能优先，保留不动）使单 crate 链接 ~4 分钟 ×2 串行。
#    现拆为每平台完整版/Lite 两个并行 job，LTO 链接时间不再叠加。
# tag run 不再保存缓存（save-if: false）：tag 作用域缓存无人能读，纯属浪费上传时间。
name: Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    # 注意：手动运行的缓存恢复依赖 ci.yml 曾在 master 上跑过 warm-rust-*（同依赖版本）
# gh release create/upload 需要写权限；默认 GITHUB_TOKEN 只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle-windows-full:
    name: 打包 Windows 完整版
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 恢复 ci.yml warm-rust-windows 预热的 release 依赖缓存（shared-key 一致即跨 job 命中）；
      # 不保存：tag 作用域的缓存后续 tag 读不到，保存只浪费时间与缓存配额
      - name: 恢复 Cargo 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-deps
          add-job-id-key: false
          save-if: false

      - name: 安装前端依赖
        run: npm ci

      # credentials.dat 为加密凭据不入库，但 tauri.conf.json 将其声明为随包资源，
      # 打包前须先生成：配置 Secret CREDENTIALS_JSON_B64 则随包预置真实凭据，缺省占位
      - name: 生成随包预置凭据
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: python scripts/ci_credentials.py

      # beforeBuildCommand(npm run build) 先产前端，再按 bundle.targets="all" 生成 msi + nsis
      - name: 打包完整版安装包
        run: npm run tauri build

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-full
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 仅 tag 触发时建 Release；workflow_dispatch 手动运行只产出 Actions 产物
      # 先 view 再 create/upload：四个打包 job 并行，Release 可能已被其它 job 建好，
      # 故 create 失败不视为错误（`|| true`）；若 upload 真失败仍会正常报错退出
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe

  bundle-windows-lite:
    name: 打包 Windows Lite 版
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 同 bundle-windows-full：恢复预热缓存，不保存
      - name: 恢复 Cargo 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-deps
          add-job-id-key: false
          save-if: false

      - name: 安装前端依赖
        run: npm ci

      # 同 bundle-windows-full：Secret 注入真实凭据，缺省占位
      - name: 生成随包预置凭据
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: python scripts/ci_credentials.py

      # Lite 纯排队版：Cargo feature `lite` + tauri.conf.lite.json（产物名 *-Lite）。
      # feature 仅切换本 crate 的 IS_LITE 编译期常量，依赖编译结果与完整版共享同一缓存
      - name: 打包 Lite 版安装包
        run: npm run tauri build -- --features lite --config src-tauri/tauri.conf.lite.json

      # 本 job 的 runner 独占 bundle 输出目录（无完整版产物），通配即全量收录 Lite 产物
      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-lite
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 同 bundle-windows-full：并行 job 下 create 可能已被其它 job 完成，失败不阻断
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe

  bundle-macos-full:
    name: 打包 macOS 完整版
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 恢复 ci.yml warm-rust-macos 预热的 release 依赖缓存；key 含 OS-arch 段故与
      # Windows 共用 shared-key 值不冲突
      - name: 恢复 Cargo 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-deps
          add-job-id-key: false
          save-if: false

      - name: 安装前端依赖
        run: npm ci

      # 同 Windows job：Secret 注入真实凭据，缺省占位
      - name: 生成随包预置凭据
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: python scripts/ci_credentials.py

      # macos-latest 为 Apple Silicon，bundle.targets="all" 在此产出 .app + aarch64 .dmg。
      # 注：产物为 adhoc 签名（无 TeamIdentifier，未公证），用户首次打开需右键「打开」放行。
      # 拆分并行 job 后本 runner 独占 bundle/dmg 目录，无需再暂存躲避 tauri-bundler 的清空行为
      - name: 打包完整版安装包
        run: npm run tauri build

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer-full
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 同 Windows job：并行 job 下 create 可能已被其它 job 完成，失败不阻断
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/dmg/*.dmg

  bundle-macos-lite:
    name: 打包 macOS Lite 版
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 同 bundle-macos-full：恢复预热缓存，不保存
      - name: 恢复 Cargo 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-deps
          add-job-id-key: false
          save-if: false

      - name: 安装前端依赖
        run: npm ci

      - name: 生成随包预置凭据
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
        run: python scripts/ci_credentials.py

      # 与完整版同口径的 Lite 纯排队版（tauri.conf.lite.json，产物名 *-Lite）
      - name: 打包 Lite 版安装包
        run: npm run tauri build -- --features lite --config src-tauri/tauri.conf.lite.json

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer-lite
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 同 bundle-macos-full：并行 job 下 create 可能已被其它 job 完成，失败不阻断
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/dmg/*.dmg
