# 发布打包：推送 tag（如 0.1.0 或 v0.1.0）触发 Windows 安装包构建，并附加到 GitHub Release
# 与 ci.yml 的分工：ci.yml 管「提交是否健康」，本文件管「版本能否发出去」
name: Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:

# gh release create/upload 需要写权限；默认 GITHUB_TOKEN 只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle-windows:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # npm run tauri build 会先执行 beforeBuildCommand(npm run build) 产出前端，
      # 再按 tauri.conf.json 的 bundle.targets="all" 生成 msi + nsis
      - name: 打包安装包
        run: npm run tauri build

      - name: 上传安装包为 Actions 产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 仅 tag 触发时建 Release；workflow_dispatch 手动运行只产出 Actions 产物
      # 先 view 再 create/upload：重复运行同一 tag 时覆盖附件而不是报错退出
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe
